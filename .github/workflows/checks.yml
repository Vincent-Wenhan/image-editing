name: checks
on: [push, pull_request]
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.1 pytest==9.1.1 numpy==1.26.4 pillow==12.1.0 PyYAML==6.0.3
      - run: ruff check . && ruff format --check .
      - run: PYTHONPATH=src pytest -q
      - run: python scripts/check_repo.py --all
