name: checks
on: [push, pull_request]
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools==69.5.1 wheel ruff==0.17.1 pytest==9.1.1 numpy==1.26.4 pillow==12.1.0 PyYAML==6.0.3
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: image-edit --help && python -m src --help
      - run: python scripts/check_repo.py --all
  torch-cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools==69.5.1 wheel ruff==0.17.1 pytest==9.1.1 numpy==1.26.4 pillow==12.1.0 PyYAML==6.0.3
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install safetensors==0.7.0 accelerate==1.12.0
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/check_repo.py --all
