[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "image-editing-research"
version = "0.1.0"
description = "Reproducible FLUX.2 Klein editing baselines and spatial-control research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.6,<2.8", "diffusers==0.37.0", "transformers>=4.57,<5",
  "accelerate>=1.10", "peft>=0.17", "huggingface-hub>=0.36,<1",
  "datasets>=4,<5", "safetensors>=0.6", "Pillow>=11", "numpy<2",
  "PyYAML>=6", "sentencepiece>=0.2", "pyarrow==23.0.1", "pandas<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]
blender = ["bpy==4.5.3"]

[project.scripts]
image-edit = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.setuptools.data-files]
"share/image-editing/configs" = ["configs/assets.lock.json", "configs/flux2_edit_lora.yaml", "configs/blender-runtime-linux.lock.json"]
"share/image-editing/configs/datasets" = ["configs/datasets/*.yaml"]
"share/image-editing/configs/experiments" = ["configs/experiments/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/Image_Editing_Preparation_and_InterEdit_Roadmap.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
